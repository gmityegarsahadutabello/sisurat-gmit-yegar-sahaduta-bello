<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifikasi - Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/jemaat/responsive.css">
</head>
<body>

  <!-- navbar placeholder (will be injected) -->
  <nav class="navbar"></nav>

  <main class="container" style="margin-top:100px; max-width:900px;">
    <div class="card">
      <div class="card-body">
        <a href="dashboard.html" class="btn btn-sm btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Kembali</a>
        <h2 id="notif-title" class="card-title">Memuat...</h2>
        <p id="notif-date" class="text-muted small"></p>
        <hr>
        <div id="notif-body">Sedang memuat notifikasi...</div>
      </div>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/navbar.js"></script>

  <script>
    // Inject navbar fragment (same pattern as dashboard.js)
    fetch('assets/components/navbar.html')
      .then(res => res.text())
      .then(html => { const el = document.querySelector('.navbar'); if (el) el.innerHTML = html; })
      .catch(() => {});

    // Helper to get query param
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadDetail() {
      const id = getQueryParam('id');
      const titleEl = document.getElementById('notif-title');
      const dateEl = document.getElementById('notif-date');
      const bodyEl = document.getElementById('notif-body');

      if (!id) {
        titleEl.textContent = 'Notifikasi tidak ditemukan';
        bodyEl.textContent = 'ID notifikasi tidak diberikan di URL.';
        return;
      }

      try {
        // try RESTful path first, fallback to query-based
        let data;
        try {
          data = await apiGet(`/notifikasi/${encodeURIComponent(id)}`);
        } catch (err) {
          data = await apiGet(`/notifikasi?id=${encodeURIComponent(id)}`);
        }

        if (!data) {
          titleEl.textContent = 'Notifikasi tidak ditemukan';
          bodyEl.textContent = 'Data notifikasi kosong.';
          return;
        }

        titleEl.textContent = data.judul || (data.pesan ? (data.pesan.length > 80 ? data.pesan.slice(0,80) + '...' : data.pesan) : 'Notifikasi');
        dateEl.textContent = new Date(data.tanggal || Date.now()).toLocaleString('id-ID', { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
        // render message as plain text (escaped) but keep line breaks
        const text = String(data.pesan || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g, '<br>');
        bodyEl.innerHTML = text || '<em>(tidak ada isi)</em>';

      } catch (err) {
        titleEl.textContent = 'Gagal memuat notifikasi';
        bodyEl.textContent = 'Terjadi kesalahan saat mengambil data.';
        console.error(err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDetail);
  </script>
</body>
</html>
