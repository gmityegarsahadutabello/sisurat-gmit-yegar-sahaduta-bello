<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daftar Pengajuan Surat - GMIT YEGAR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/table.css">
  <link rel="stylesheet" href="assets/css/filter.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/jemaat/daftar-pengajuan.css">
  <link rel="stylesheet" href="assets/css/confirmation-modal.css">
  <link rel="stylesheet" href="assets/css/jemaat/responsive.css">
  <style>
    .back-to-dashboard {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }
    .back-to-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      color: white;
    }
  </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="nav-left">
            <h2 class="logo">Gereja</h2>
        </div>
        <ul class="nav-menu">
            <li><a href="dashboard.html">Beranda</a></li>
            <li class="dropdown">
                <a class="dropdown-btn">Surat ▾</a>
                <ul class="dropdown-menu">
                    <li><a href="pengajuan.html">Pengajuan</a></li>
                    <li><a href="daftar-pengajuan.html">Daftar Pengajuan Surat</a></li>
                    <li><a href="surat-masuk.html">Surat Masuk</a></li>
                </ul>
            </li>
            <li class="dropdown">
                <a class="dropdown-btn">Notifikasi ▾</a>
                <ul class="dropdown-menu" id="notif-list">
                    <li class="empty">Tidak ada notifikasi</li>
                </ul>
            </li>
            <li class="dropdown">
                <a class="dropdown-btn d-flex align-items-center">
                    <img id="profile-img" src="assets/img/logo-gmit.png" alt="avatar" class="rounded-circle me-2" width="36" height="36">
                    <div class="d-none d-lg-block text-start">
                        <div id="profile-name" class="fw-bold">Nama Jemaat</div>
                        <div id="profile-role" class="small text-muted">Jemaat</div>
                    </div>
                </a>
                <ul class="dropdown-menu" aria-labelledby="profileDropdown">
                    <li><a href="profile.html">Profil</a></li>
                    <li><hr></li>
                    <li><button id="logout-btn" class="dropdown-item text-danger" type="button">Keluar</button></li>
                </ul>
            </li>
        </ul>
    </nav>

  <main class="container my-5">
    <a href="dashboard.html" class="back-to-dashboard">
      <i class="bi bi-arrow-left-circle-fill"></i>
      Kembali ke Dashboard
    </a>
    <div class="page-header">
      <h1 class="title">Daftar Pengajuan Surat</h1>
      <a href="pengajuan.html" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Ajukan Surat
      </a>
    </div>

    <div class="card mb-4">
      <div class="card-body filter-bar">
        <form id="filter-form" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label">Tanggal Mulai</label>
            <input type="date" id="filter-start" class="form-control" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Tanggal Selesai</label>
            <input type="date" id="filter-end" class="form-control" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select id="filter-status" class="form-select">
              <option value="all">Semua</option>
              <option value="proses">Dalam Proses</option>
              <option value="diterima">Selesai</option>
              <option value="ditolak">Ditolak</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Cari</label>
            <div class="search-wrap">
              <i class="bi bi-search"></i>
              <input type="text" id="filter-q" class="form-control" placeholder="Cari jenis/perihal..." />
            </div>
          </div>
          <div class="col-12 d-flex justify-content-between align-items-center mt-1">
            <div id="result-info"></div>
            <div>
              <button id="filter-apply" type="button" class="btn btn-primary">
                <i class="bi bi-funnel me-1"></i> Terapkan
              </button>
              <button id="filter-reset" type="button" class="btn btn-link">Reset</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div id="table-area" class="table-responsive">
          <div class="text-center py-3" id="loading">Memuat daftar...</div>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal for tracking -->
  <div class="modal fade" id="trackModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Lacak Pengajuan</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="track-body">Memuat...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Load navbar component first
    (async () => {
      try {
        const res = await fetch('assets/components/navbar.html');
        const html = await res.text();
        const el = document.querySelector('.navbar');
        if (el) el.innerHTML = html;
      } catch(e) { console.warn('Failed to load navbar:', e); }
    })();
  </script>
  <script src="assets/js/confirmation-modal.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/daftar-pengajuan.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
