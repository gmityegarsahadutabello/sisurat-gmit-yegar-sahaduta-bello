<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surat Masuk - GMIT YEGAR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/table.css">
  <link rel="stylesheet" href="assets/css/filter.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/confirmation-modal.css">
  <link rel="stylesheet" href="assets/css/jemaat/responsive.css">
  <style>
    .back-to-dashboard {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }
    .back-to-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      color: white;
    }
  </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="nav-left">
            <h2 class="logo">Gereja</h2>
        </div>
        <ul class="nav-menu">
            <li><a href="dashboard.html">Beranda</a></li>
            <li class="dropdown">
                <a class="dropdown-btn">Surat ▾</a>
                <ul class="dropdown-menu">
                    <li><a href="pengajuan.html">Pengajuan</a></li>
                    <li><a href="daftar-pengajuan.html">Daftar Pengajuan Surat</a></li>
                    <li><a href="surat-masuk.html">Surat Masuk</a></li>
                </ul>
            </li>
            <li class="dropdown">
                <a class="dropdown-btn">Notifikasi ▾</a>
                <ul class="dropdown-menu" id="notif-list">
                    <li class="empty">Tidak ada notifikasi</li>
                </ul>
            </li>
            <li class="dropdown">
                <a class="dropdown-btn d-flex align-items-center">
                    <img id="profile-img" src="assets/img/logo-gmit.png" alt="avatar" class="rounded-circle me-2" width="36" height="36">
                    <div class="d-none d-lg-block text-start">
                        <div id="profile-name" class="fw-bold">Nama Jemaat</div>
                        <div id="profile-role" class="small text-muted">Jemaat</div>
                    </div>
                </a>
                <ul class="dropdown-menu" aria-labelledby="profileDropdown">
                    <li><a href="profile.html">Profil</a></li>
                    <li><hr></li>
                    <li><button id="logout-btn" class="dropdown-item text-danger" type="button">Keluar</button></li>
                </ul>
            </li>
        </ul>
    </nav>

  <main class="container my-5">
    <a href="dashboard.html" class="back-to-dashboard">
      <i class="bi bi-arrow-left-circle-fill"></i>
      Kembali ke Dashboard
    </a>
    <h1 class="mb-4">Surat Masuk</h1>

    <div class="card mb-4">
      <div class="card-body">
        <form id="filter-form" class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Tanggal Mulai</label>
            <input type="date" id="start-date" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Tanggal Selesai</label>
            <input type="date" id="end-date" class="form-control">
          </div>
          <div class="col-md-4 d-grid">
            <button id="apply-filter" type="button" class="btn btn-primary">Terapkan</button>
            <button id="reset-filter" type="button" class="btn btn-link mt-2">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div id="table-area" class="table-responsive">
          <div class="text-center py-3" id="loading">Memuat daftar surat masuk...</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // inject navbar
    fetch('assets/components/navbar.html')
      .then(r => r.text()).then(html => { const el = document.querySelector('.navbar'); if (el) el.innerHTML = html; }).catch(()=>{});
  </script>
  <script src="assets/js/confirmation-modal.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/surat-masuk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
