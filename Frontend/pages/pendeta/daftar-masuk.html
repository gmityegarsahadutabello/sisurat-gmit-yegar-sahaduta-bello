<!doctype html>
<html lang="id">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daftar Masuk - Pendeta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/navbar.css">
  <link rel="stylesheet" href="../../assets/css/table.css">
  <link rel="stylesheet" href="../../assets/css/confirmation-modal.css">
  <link rel="stylesheet" href="../../assets/css/pendeta/daftar-masuk.css">
  <link rel="stylesheet" href="../../assets/css/pendeta/daftar-masuk.css">
  <link rel="stylesheet" href="../../assets/css/pendeta/responsive-pendeta.css">
</head>
<body>

  <header class="navbar-container navbar">
    <!-- Navbar component will be injected here -->
  </header>

  <main class="container my-5">
    <!-- Page Header -->
    <div class="page-header">
      <div class="header-content">
        <a href="dashboard-pendeta.html" class="btn-back">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div class="header-text">
          <h1 class="page-title">
            <i class="bi bi-inbox-fill"></i>
            Surat Masuk
          </h1>
          <p class="page-subtitle">Kelola surat yang perlu pemeriksaan Pendeta</p>
        </div>
      </div>
    </div>

    <!-- Filter Card -->
    <div class="filter-card">
      <div class="filter-header">
        <i class="bi bi-funnel"></i>
        <span>Filter & Pencarian</span>
      </div>
      <div class="filter-body">
        <div class="filter-grid">
          <div class="filter-item">
            <label class="filter-label">
              <i class="bi bi-search"></i>
              Pencarian
            </label>
            <input id="search" class="filter-input" placeholder="Cari nama pengaju atau jenis surat..." />
          </div>
          <div class="filter-item">
            <label class="filter-label">
              <i class="bi bi-calendar3"></i>
              Bulan
            </label>
            <select id="filter-month" class="filter-select">
              <option value="">Semua Bulan</option>
              <option value="current">Bulan Ini</option>
              <option value="last">Bulan Lalu</option>
              <option value="year">Tahun Ini</option>
            </select>
          </div>
          <div class="filter-item">
            <label class="filter-label">
              <i class="bi bi-tag"></i>
              Jenis Surat
            </label>
            <select id="filter-jenis" class="filter-select">
              <option value="">Semua Jenis</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button id="btn-reset" class="btn-filter btn-reset">
            <i class="bi bi-arrow-counterclockwise"></i>
            Reset Filter
          </button>
          <button id="btn-refresh" class="btn-filter btn-apply">
            <i class="bi bi-arrow-clockwise"></i>
            Refresh Data
          </button>
        </div>
      </div>
    </div>

    <!-- Result Count -->
    <div class="result-info">
      <i class="bi bi-info-circle"></i>
      <span id="result-count">Memuat data...</span>
    </div>

    <!-- Table Card -->
    <div class="table-card">
      <div class="table-header">
        <i class="bi bi-table"></i>
        <span>Daftar Surat Masuk</span>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Waktu Diterima</th>
              <th>Jenis Surat</th>
              <th>Nama Pengaju</th>
              <th>Status</th>
              <th class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="list-body">
            <tr>
              <td colspan="5" class="text-center">
                <div class="loading-state">
                  <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  <p class="mt-3">Memuat data surat masuk...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/navbar.js"></script>
  <script src="../../assets/js/confirmation-modal.js"></script>
  <script src="../../assets/js/pendeta/navbar-pendeta.js"></script>
  <script src="../../assets/js/pendeta/daftar-masuk.js"></script>
  <script src="../../assets/js/pendeta/daftar-masuk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
