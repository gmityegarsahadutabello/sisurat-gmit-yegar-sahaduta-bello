<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ganti Password - Sistem Surat Jemaat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg" style="max-width: 500px; width: 100%;">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <div class="bg-warning text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" 
               style="width: 70px; height: 70px;">
            <i class="bi bi-key-fill" style="font-size: 2rem;"></i>
          </div>
          <h3 class="fw-bold">Ganti Password Permanent</h3>
          <p class="text-muted">
            Anda login menggunakan password sementara. Silakan buat password baru untuk keamanan akun Anda.
          </p>
        </div>

        <div class="alert alert-info mb-4">
          <i class="bi bi-info-circle"></i> 
          Password baru minimal 6 karakter dan harus berbeda dari password sementara.
        </div>

        <form id="change-password-form">
          <div class="mb-3">
            <label for="new-password" class="form-label fw-semibold">Password Baru <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="password" class="form-control" id="new-password" 
                     placeholder="Minimal 6 karakter" required minlength="6">
              <button class="btn btn-outline-secondary" type="button" id="toggle-new-password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label for="confirm-password" class="form-label fw-semibold">Konfirmasi Password Baru <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirm-password" 
                     placeholder="Ulangi password baru" required minlength="6">
              <button class="btn btn-outline-secondary" type="button" id="toggle-confirm-password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <small id="password-match-feedback" class="form-text"></small>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-submit">
            <i class="bi bi-shield-check"></i> Simpan Password Baru
          </button>
        </form>

        <div class="mt-3 text-center">
          <small class="text-muted">
            Password akan di-enkripsi dengan aman dan tidak dapat dikembalikan.
          </small>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    (function(){
      const qs = id => document.getElementById(id);
      
      function getDashboardByRole(role) {
        const map = {
          'jemaat': '../dashboard.html',
          'koordinator': '../pages/koordinator/dashboard.html',
          'tatausaha': '../pages/tatausaha/dashboard-tatausaha.html',
          'sekretaris': '../pages/sekretaris/dashboard-sekretaris.html',
          'pendeta': '../pages/pendeta/dashboard-pendeta.html',
          'admin': '../pages/admin/dashboard-admin.html'
        };
        return map[role] || '../dashboard.html';
      }
      
      // Resolve current user from LS or localStorage
      const lsUser = (window.LS && typeof window.LS.getCurrentUser === 'function') ? window.LS.getCurrentUser() : null;
      const storedCurrent = !lsUser ? (JSON.parse(localStorage.getItem('currentUser') || 'null')) : null;
      const storedLegacy = !lsUser && !storedCurrent ? (JSON.parse(localStorage.getItem('user') || 'null')) : null;
      const user = lsUser || storedCurrent || storedLegacy || {};

      // Check login state
      if (!user || (!user._id && !user.id)) {
        alert('Anda belum login. Silakan login terlebih dahulu.');
        window.location.href = '../index.html';
        return;
      }

      // If not temporary password, redirect to dashboard
      if (!user.is_password_sementara) {
        alert('Anda tidak memerlukan ganti password. Password Anda sudah permanent.');
        window.location.href = getDashboardByRole(user.role || 'jemaat');
        return;
      }

      // Toggle password visibility
      qs('toggle-new-password')?.addEventListener('click', () => {
        const input = qs('new-password');
        const icon = qs('toggle-new-password').querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        }
      });

      qs('toggle-confirm-password')?.addEventListener('click', () => {
        const input = qs('confirm-password');
        const icon = qs('toggle-confirm-password').querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        }
      });

      // Real-time password match validation
      function checkPasswordMatch() {
        const newPass = qs('new-password')?.value || '';
        const confirmPass = qs('confirm-password')?.value || '';
        const feedback = qs('password-match-feedback');
        
        if (confirmPass === '') {
          feedback.textContent = '';
          feedback.className = 'form-text';
          return true;
        }

        if (newPass === confirmPass) {
          feedback.textContent = '✓ Password cocok';
          feedback.className = 'form-text text-success';
          return true;
        } else {
          feedback.textContent = '✗ Password tidak cocok';
          feedback.className = 'form-text text-danger';
          return false;
        }
      }

      qs('new-password')?.addEventListener('input', checkPasswordMatch);
      qs('confirm-password')?.addEventListener('input', checkPasswordMatch);

      // Form submission
      qs('change-password-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const newPassword = qs('new-password')?.value;
        const confirmPassword = qs('confirm-password')?.value;

        if (!newPassword || !confirmPassword) {
          alert('Password baru dan konfirmasi password wajib diisi');
          return;
        }

        if (newPassword.length < 6) {
          alert('Password minimal 6 karakter');
          return;
        }

        if (newPassword !== confirmPassword) {
          alert('Password baru dan konfirmasi tidak cocok');
          return;
        }

        const btnSubmit = qs('btn-submit');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...';

        try {
          const data = await window.API.request('/users/change-password-permanent', 'POST', {
            user_id: user._id || user.id,
            new_password: newPassword,
            confirm_password: confirmPassword
          });

          console.log('✅ Password berhasil diubah:', data);

          // Update session (remove temporary flag) via LS helper
          const updated = { ...(user || {}), is_password_sementara: false };
          if (window.LS && typeof window.LS.setCurrentUser === 'function') {
            window.LS.setCurrentUser(updated);
          } else {
            localStorage.setItem('currentUser', JSON.stringify(updated));
          }

          alert('Password berhasil diubah! Silakan gunakan password baru untuk login selanjutnya.');
          
          // Redirect to dashboard
          window.location.href = getDashboardByRole(user.role || 'jemaat');

        } catch (error) {
          console.error('❌ Error ganti password:', error);
          alert(`Gagal mengubah password: ${error.message}`);
          
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="bi bi-shield-check"></i> Simpan Password Baru';
        }
      });

    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
