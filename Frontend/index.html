<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk ke Akun - SI SURAT GMIT Yegar Sahaduta Bello</title>
  <meta name="description" content="Masuk ke Sistem Informasi Surat (SI SURAT) GMIT Yegar Sahaduta Bello. Layanan online administrasi surat jemaat seperti baptis, nikah, sidi, dan lainnya." />
  <meta name="keywords" content="GMIT Yegar, SI SURAT, GMIT Yegar Sahaduta Bello, Jemaat Bello, Surat Jemaat Online, Surat Baptis, Surat Nikah" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://gmityegar.com/index.html" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
</head>
<body class="auth-page">

  <!-- Logo and Church Name (no container) -->
  <div class="auth-brand">
    <img src="assets/img/logo-gmit.png" alt="GMIT Logo" class="auth-logo">
    <div class="auth-text">
      <div class="small-title">GMIT YEGAR</div>
      <div class="main-title">SAHADUTA BELLO</div>
    </div>
  </div>

  <main class="d-flex align-items-center justify-content-center" style="flex: 1;">
    <div class="card auth-card shadow">
      <div class="card-body">
        <div class="text-center mb-4">
          <h3 class="card-title mb-2">Selamat Datang</h3>
          <p class="text-muted small mb-0">Masuk ke akun Anda untuk melanjutkan</p>
        </div>

        <div id="alert-area"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label for="login-identity" class="form-label">
              <i class="bi bi-person-circle me-1"></i>NIK atau Email
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="text" id="login-identity" class="form-control" placeholder="Masukkan NIK atau email" required autocomplete="username">
            </div>
            <div class="invalid-feedback">Masukkan NIK atau email yang valid.</div>
          </div>

          <div class="mb-3">
            <label for="login-password" class="form-label">
              <i class="bi bi-lock-fill me-1"></i>Password
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" id="login-password" class="form-control" placeholder="Masukkan kata sandi" required autocomplete="current-password">
              <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                <i class="bi bi-eye" id="eye-icon"></i>
              </button>
            </div>
            <div class="invalid-feedback">Masukkan password Anda.</div>
          </div>

          <div class="d-flex justify-content-end mb-3">
            <a class="btn btn-link btn-sm text-decoration-none p-0" href="reset-password.html">
              <i class="bi bi-question-circle me-1"></i>Lupa Password?
            </a>
          </div>

          <div class="d-grid mb-3">
            <button id="login-btn" type="submit" class="btn btn-primary btn-lg">
              <span class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
              <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
            </button>
          </div>

          <div class="text-center">
            <hr class="my-3">
            <p class="text-muted small mb-2">Belum punya akun?</p>
            <a class="btn btn-outline-primary w-100" href="register.html">
              <i class="bi bi-person-plus me-2"></i>Daftar Akun Baru
            </a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Password Toggle Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePassword = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (togglePassword) {
        togglePassword.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          eyeIcon.classList.toggle('bi-eye');
          eyeIcon.classList.toggle('bi-eye-slash');
        });
      }
    });
  </script>
</body>
</html>
